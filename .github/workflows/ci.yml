name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    name: Windows x64 checks
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x64-ci
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release versions
        run: node scripts/validate-release.mjs
      - name: TypeScript type check
        run: pnpm typecheck
      - name: Check formatting
        run: pnpm format:check
      - name: Unit tests
        run: pnpm test:unit
      - name: Build frontend
        run: pnpm build:renderer
      - name: Create frontend dist placeholder
        shell: pwsh
        run: New-Item -ItemType Directory -Path "dist" -Force | Out-Null
      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - name: Clippy
        run: cargo clippy --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Backend tests
        run: cargo test --locked --target x86_64-pc-windows-msvc --manifest-path src-tauri/Cargo.toml
