name: Release
run-name: Windows x64 ${{ inputs.tag || github.ref_name }} [${{ inputs.request_id || 'tag' }}]

# cc-switch-release: windows-x64-v1
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag, for example v3.20.2-2"
        required: true
        type: string
      request_id:
        description: "Filled automatically by pnpm release; leave empty for manual runs"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows-x64:
    name: Build and publish Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-x64-release
          cache-on-failure: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate release versions
        run: node scripts/validate-release.mjs
      - name: TypeScript type check
        run: pnpm typecheck
      - name: Check formatting
        run: pnpm format:check
      - name: Release regression tests
        run: pnpm exec vitest run tests/scripts/release.test.mjs tests/scripts/validate-release.test.mjs tests/scripts/generate-updater-manifest.test.mjs
      - name: Build, verify signatures, and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: pnpm release:local --tag "$env:RELEASE_TAG"
      - name: Save cloud build verification record
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-build-${{ inputs.tag || github.ref_name }}
          path: |
            release/${{ inputs.tag || github.ref_name }}/build-cache/build.json
            dist/index.html
          retention-days: 7
          if-no-files-found: warn
